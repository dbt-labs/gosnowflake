name: dbt CI

# dbt-fork-only workflow. The upstream workflows are disabled in the repo's Actions
# settings (not edited) so merging upstream never conflicts here. See ci/dbt/README.md.

on:
  push:
    branches:
      - master
      - dbt/wip
      - 'v*dbt'
  pull_request:
    branches:
      - master
      - dbt/wip
      - 'v*dbt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Build, vet, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4 # for wiremock
        with:
          java-version: 17
          distribution: temurin
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test
        shell: bash
        run: ./ci/dbt/test.sh
      - name: Upload test output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: ci/dbt/out/

  # The only check that needs to be required on protected branches.
  gate:
    name: dbt-ci gate
    if: ${{ always() }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          [[ "${{ needs.lint.result }}" == "success" && "${{ needs.test.result }}" == "success" ]]
