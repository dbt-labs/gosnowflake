name: dbt CI

# dbt-fork-only workflow. The upstream workflows are disabled in the repo's Actions
# settings (not edited) so merging upstream never conflicts here. See ci/dbt/README.md.

on:
  push:
    branches:
      - master
      - dbt/wip
      - 'v*dbt'
  pull_request:
    branches:
      - master
      - dbt/wip
      - 'v*dbt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Build, vet, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4 # for wiremock
        with:
          java-version: 17
          distribution: temurin
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python ci/dbt/test.py
      - name: Upload test output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: ci/dbt/out/

  # The only check that needs to be required on protected branches.
  gate:
    name: dbt-ci gate
    if: ${{ always() }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          [[ "${{ needs.lint.result }}" == "success" && "${{ needs.test.result }}" == "success" ]]

  # Comments on the PR when tests in the baseline now pass, so the baseline can be shrunk.
  # Not part of the gate; it only reports.
  report:
    name: Report fixed baseline tests
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-output-*
          path: out
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- dbt-ci-baseline-fixed -->'
          {
            echo "$marker"
            echo "These tests are in the baseline (\`ci/dbt/baseline/\`) but now pass. Remove them from the baseline:"
            found=0
            for f in out/*/fixed-*.json; do
              jq -e 'length > 0' "$f" > /dev/null || continue
              found=1
              os="$(basename "$f" .json)"; os="${os#fixed-}"
              printf '\n**%s**\n```\n' "$os"; jq -r '.[].test' "$f"; printf '```\n'
            done
          } > comment.md
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)"
          if [[ "$found" == 0 ]]; then
            [[ -n "$id" ]] && gh api -X DELETE "repos/$REPO/issues/comments/$id"
            exit 0
          fi
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md
          fi
